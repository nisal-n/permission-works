<div class="row g-3">
  <div class="col-lg-5">
    <div class="card p-3">
      <h5 class="mb-3">Create Ticket</h5>
      <div id="tkt-alert" class="alert d-none" role="alert"></div>

      <div class="mb-3">
        <label class="form-label">Subject</label>
        <input id="tkt-subject" class="form-control" placeholder="e.g., Can’t grant Lobby page">
      </div>

      <div class="mb-3">
        <label class="form-label">Priority</label>
        <select id="tkt-priority" class="form-select">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
          <option>Critical</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea id="tkt-description" class="form-control" rows="5" placeholder="Describe the issue…"></textarea>
      </div>

      <button id="tkt-create" class="btn btn-primary">Create Ticket</button>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="card p-3">
      <h5 class="mb-3">My Tickets</h5>
      <div id="tickets-list" class="list-group small"></div>
      <hr>
      <div id="thread" class="d-none">
        <div class="d-flex align-items-center justify-content-between">
          <h6 id="thread-title" class="mb-0"></h6>
          <span id="thread-meta" class="badge text-bg-secondary"></span>
        </div>
        <div id="thread-messages" class="mt-3" style="max-height: 280px; overflow:auto;"></div>
        <div class="input-group mt-3">
          <input id="reply-text" class="form-control" placeholder="Write a reply…">
          <button id="reply-send" class="btn btn-outline-primary">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const A = document.getElementById('tkt-alert');
  function alertMsg(kind, msg){
    A.className = 'alert alert-' + kind;
    A.textContent = msg;
    A.classList.remove('d-none');
  }
  function clearAlert(){ A.classList.add('d-none'); }

  const UI = {
    subject: document.getElementById('tkt-subject'),
    priority: document.getElementById('tkt-priority'),
    desc: document.getElementById('tkt-description'),
    create: document.getElementById('tkt-create'),
    list: document.getElementById('tickets-list'),
    thread: document.getElementById('thread'),
    threadTitle: document.getElementById('thread-title'),
    threadMeta: document.getElementById('thread-meta'),
    msgs: document.getElementById('thread-messages'),
    replyText: document.getElementById('reply-text'),
    replySend: document.getElementById('reply-send'),
  };

  let CURRENT_TICKET_ID = null;
  let MY_TICKETS = [];

  async function loadTickets(){
    const r = await fetch('/dashboard/api/tickets');
    if(!r.ok){ alertMsg('danger','Failed to load tickets'); return; }
    const j = await r.json();
    if(!j.ok){ alertMsg('danger','Failed to load tickets'); return; }
    MY_TICKETS = j.tickets || [];
    renderList();
  }

  function renderList(){
    if(!MY_TICKETS.length){
      UI.list.innerHTML = '<div class="list-group-item">No tickets yet.</div>';
      return;
    }
    UI.list.innerHTML = MY_TICKETS.map(t => `
      <a href="#" data-id="${t.id}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <div>
          <div><strong>${t.id}</strong> — ${escapeHtml(t.subject)}</div>
          <div class="text-muted">Priority: ${t.priority} • Created: ${fmtTime(t.created_ts)}</div>
        </div>
        <span class="badge text-bg-secondary">${t.status || 'Open'}</span>
      </a>
    `).join('');
    [...UI.list.querySelectorAll('a')].forEach(a => a.addEventListener('click', (e) => {
      e.preventDefault();
      openThread(a.dataset.id);
    }));
  }

  function fmtTime(ts){
    try{ return new Date(ts*1000).toLocaleString(); }catch(e){ return ''; }
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function openThread(tid){
    const r = await fetch('/dashboard/api/tickets/'+encodeURIComponent(tid));
    if(!r.ok){ alertMsg('danger','Failed to open ticket'); return; }
    const j = await r.json();
    if(!j.ok){ alertMsg('danger','Failed to open ticket'); return; }
    const t = j.ticket;
    CURRENT_TICKET_ID = t.id;
    UI.threadTitle.textContent = `${t.id} — ${t.subject}`;
    UI.threadMeta.textContent = `Priority: ${t.priority}`;
    UI.msgs.innerHTML = (t.messages || []).map(m => `
      <div class="mb-2">
        <div class="${m.system ? 'text-muted' : ''}"><strong>${escapeHtml(m.author)}</strong> • ${fmtTime(m.ts)}</div>
        <div>${escapeHtml(m.text)}</div>
      </div>
    `).join('');
    UI.thread.classList.remove('d-none');
    UI.msgs.scrollTop = UI.msgs.scrollHeight;
  }

  async function createTicket(){
    clearAlert();
    const payload = {
      subject: UI.subject.value.trim(),
      priority: UI.priority.value,
      description: UI.desc.value.trim(),
    };
    if(!payload.subject || !payload.description){
      alertMsg('warning','Subject and Description are required.');
      return;
    }
    const r = await fetch('/dashboard/api/tickets', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if(!r.ok || !j.ok){
      alertMsg('danger', (j && (j.error||j.message)) || ('HTTP '+r.status));
      return;
    }
    UI.subject.value = '';
    UI.priority.value = 'Medium';
    UI.desc.value = '';
    await loadTickets();
    await openThread(j.ticket.id);
  }

  async function sendReply(){
    if(!CURRENT_TICKET_ID) return;
    const text = UI.replyText.value.trim();
    if(!text) return;
    const r = await fetch('/dashboard/api/tickets/'+encodeURIComponent(CURRENT_TICKET_ID)+'/reply', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({ text })
    });
    const j = await r.json();
    if(!r.ok || !j.ok){
      alertMsg('danger', (j && (j.error||j.message)) || ('HTTP '+r.status));
      return;
    }
    UI.replyText.value = '';
    await openThread(CURRENT_TICKET_ID);
  }

  UI.create.addEventListener('click', createTicket);
  UI.replySend.addEventListener('click', sendReply);
  UI.replyText.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendReply(); }
  });

  loadTickets();
</script>
