<div class="container-fluid">
  <h4 class="mb-3">Create a Permission Set</h4>

  <form method="post" action="{{ create_url }}">
    <input type="hidden" name="mode" value="create">

    <!-- Permission Set -->
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Permission Set</label>
        <input type="text"
               class="form-control"
               name="role_name"
               placeholder="e.g., AAG_B2B_USER"
               required>
      </div>

      <!-- Role Type (match what backend expects) -->
      <div class="col-md-4">
        <label class="form-label mb-1">Role type</label>
        <select class="form-select" name="role_type" id="role_type" required>
          <option value="EndUserRole" selected>End User Role</option>
          <option value="FunctionalRole">Functional Role</option>
        </select>
      </div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Proceed</button>
    </div>
  </form>
</div>
