<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login – Permission Works - OasisPro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .card { border:none; box-shadow:0 10px 25px rgba(0,0,0,.06); }
    .brand { letter-spacing:.2px; }
    .btn-primary { box-shadow: 0 4px 12px rgba(0,97,242,.25); }
    .form-control { background:#f3f7ff; }
    .input-group .form-control { background:#f3f7ff; }
  </style>
</head>
<body>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card p-4" style="max-width:420px; width:100%;">
    <h3 class="mb-2 text-center brand">Permission Works <span class="text-primary">OasisPro</span></h3>
    <p class="text-muted text-center mb-4">Sign in to continue</p>

    {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="on">
      <div class="mb-3">
        <label class="form-label">Username or email</label>
        <input name="username" class="form-control" placeholder="e.g. jdoe or jdoe@company.com" autofocus required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input id="pw" name="password" type="password" class="form-control" autocomplete="current-password" required>
          <button class="btn btn-outline-secondary" type="button" aria-label="Show password" onclick="togglePw(this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-primary w-100">Login</button>
    </form>

    <p class="text-center mt-3 text-muted" style="font-size:.9rem;">
      Please use your application credentials.
    </p>
  </div>
</div>

<script>
  function togglePw(btn){
    const input = document.getElementById('pw');
    const icon = btn.querySelector('i');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    icon.classList.toggle('bi-eye', showing);
    icon.classList.toggle('bi-eye-slash', !showing);
  }
</script>
</body>
</html>
