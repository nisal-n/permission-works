<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Permission Set Created</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .page-wrap { max-width: 820px; margin: 48px auto; }
    .card { border: 1px solid #e5e7eb; }
    .title { font-weight: 700; font-size: 1.5rem; }
    .pill { display:inline-block; padding:.25rem .5rem; border-radius:.5rem; background:#f8f9fa; border:1px solid #e5e7eb; }
    .muted { color:#6c757d; }
    .pending-list code { display:inline-block; margin:.15rem .35rem .15rem 0; }
  </style>
</head>
<body class="bg-light">
  <div class="page-wrap">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex align-items-center mb-3">
          <div id="statusIcon" class="bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-circle d-inline-flex align-items-center justify-content-center me-3" style="width:44px;height:44px;font-size:22px;">⟳</div>
          <div>
            <div class="title mb-0">Permission Set Created</div>
            <div id="statusText" class="muted">Do not close — validating permission set in IFS…</div>
          </div>
        </div>

        <dl class="row mb-4">
          <dt class="col-sm-3">Name</dt>
          <dd class="col-sm-9"><span class="pill">{{ role }}</span></dd>

          <dt class="col-sm-3">Created by</dt>
          <dd class="col-sm-9">Admin</dd>

          <dt class="col-sm-3">Date &amp; time</dt>
          <dd class="col-sm-9"><span id="ts" class="muted">—</span></dd>
        </dl>

        <div id="resultAlert" class="alert alert-info d-flex align-items-center" role="alert">
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          <span id="resultMessage">Sync logic is running. Please wait until validation finishes.</span>
        </div>

        <div id="pendingWrap" class="d-none mb-3">
          <div class="small fw-semibold mb-2">Pending validation items</div>
          <div id="pendingList" class="pending-list small"></div>
        </div>

        <div class="d-flex gap-2">
          <button id="syncBtn" class="btn btn-primary" type="button" disabled>
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Syncing…
          </button>
          <a id="btnBack" href="{{ url_for('permissions.create_permission_ui', role=role) }}" class="btn btn-outline-secondary disabled" aria-disabled="true">Back to role</a>
          <a id="btnDashboard" href="{{ dashboard_url }}" class="btn btn-outline-secondary disabled" aria-disabled="true">Dashboard</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const el = document.getElementById('ts');
      const tz = 'Asia/Colombo';
      function format(dt) {
        const d = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(dt);
        const t = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: true }).format(dt);
        return `${d} ${t}`;
      }
      fetch('https://worldtimeapi.org/api/timezone/' + encodeURIComponent(tz), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => { el.textContent = format(new Date(data.datetime)); })
        .catch(() => { el.textContent = format(new Date()); });
    })();

    (function () {
      const role = {{ role|tojson }};
      const statusText = document.getElementById('statusText');
      const resultAlert = document.getElementById('resultAlert');
      const resultMessage = document.getElementById('resultMessage');
      const pendingWrap = document.getElementById('pendingWrap');
      const pendingList = document.getElementById('pendingList');
      const syncBtn = document.getElementById('syncBtn');
      const btnBack = document.getElementById('btnBack');
      const btnDashboard = document.getElementById('btnDashboard');
      const statusIcon = document.getElementById('statusIcon');
      let attempts = 0;

      function setDoneState(kind, msg, pending) {
        const ok = kind === 'success';
        statusText.textContent = msg;
        resultAlert.className = 'alert ' + (ok ? 'alert-success' : 'alert-warning');
        resultMessage.textContent = msg;
        syncBtn.disabled = true;
        syncBtn.innerHTML = ok ? 'Completed' : 'Validation finished';
        btnBack.classList.remove('disabled');
        btnBack.removeAttribute('aria-disabled');
        btnDashboard.classList.remove('disabled');
        btnDashboard.removeAttribute('aria-disabled');
        statusIcon.className = (ok ? 'bg-success bg-opacity-10 text-success border border-success border-opacity-25' : 'bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25') + ' rounded-circle d-inline-flex align-items-center justify-content-center me-3';
        statusIcon.textContent = ok ? '✓' : '!';
        if (pending && Object.keys(pending).length) {
          pendingWrap.classList.remove('d-none');
          const html = [];
          Object.entries(pending).forEach(([key, items]) => {
            if (!items || !items.length) return;
            html.push(`<div class="mb-2"><strong>${key}</strong><br>${items.map(v => `<code>${v}</code>`).join('')}</div>`);
          });
          pendingList.innerHTML = html.join('');
        }
      }

      async function poll() {
        attempts += 1;
        try {
          const resp = await fetch(`/api/permission_set_finalize_status?role=${encodeURIComponent(role)}`, { headers: { 'Accept': 'application/json' } });
          const data = await resp.json();
          if (!resp.ok || !data || data.ok === false) throw new Error((data && (data.error || data.details)) || ('HTTP ' + resp.status));
          const msg = data.message || 'Validation is running…';
          statusText.textContent = msg;
          resultMessage.textContent = msg;
          if (data.status === 'success' || data.status === 'warning') {
            setDoneState(data.status, msg, data.pending || {});
            return;
          }
        } catch (e) {
          if (attempts > 8) {
            setDoneState('warning', 'Validation could not be confirmed automatically. Please review the permission set in IFS.', {});
            return;
          }
        }
        setTimeout(poll, 5000);
      }
      poll();
    })();
  </script>
</body>
</html>
